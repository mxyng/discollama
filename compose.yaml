version: '3'
services:
  discollama:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ['--redis-host', 'redis']
    env_file:
      - .env
    environment:
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=qwen3.5

  redis:
    image: redis/redis-stack-server:latest
    restart: always
    volumes:
      - /data
    ports:
      - 6379
